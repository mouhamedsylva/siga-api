# EXEMPLE — écran de confirmation de l'application Orange Money / Max it (à valider en phase 0)
id: om-capture-v1
operator: orange_money
kind: capture
example: true
detect:
  - 'orange money|max ?it|\bom\b'
  - '(?:transfert|paiement|envoy[ée])'
fields:
  amount: '(?:montant|transfert de)\s*:?\s*([\d][\d .,]*)\s*(?:f\s*cfa|fcfa|f)'
  ref: '(?:trans(?:action)?\s*id|r[ée]f[ée]rence|ref)\s*:?\s*([A-Z0-9][A-Z0-9_.\-]{5,})'
  datetime: '(\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}(?:\s*(?:à|a)?\s*\d{1,2}\s*[:h]\s*\d{2})?)'
  sender: '(?:de|exp[ée]diteur)\s*:?\s*([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .\-]{1,40}?)\s*(?:\(|\d|$)'
required: [amount, ref]
