# EXEMPLE — à remplacer par le format réel observé en phase 0
id: wave-sms-recu-v1
operator: wave
kind: sms
example: true
detect:
  - 'wave'
  - 're[cç]u'
fields:
  amount: 're[cç]u\s+([\d][\d .,]*)\s*f'
  ref: '(?:id de transaction|transaction|r[ée]f[ée]rence|ref)\s*:?\s*([A-Z0-9][A-Z0-9_.\-]{5,})'
  datetime: '(\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}(?:\s*(?:à|a)?\s*\d{1,2}\s*[:h]\s*\d{2})?)'
  sender: 'de\s+([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ .\-]{1,40}?)\s*\('
required: [amount, ref]
